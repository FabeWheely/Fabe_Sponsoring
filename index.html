
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="contact">
    <div class="contact-header">
        <span class="eyebrow">GET IN TOUCH</span>
        <h1>Contact me<span>.</span></h1>
        <p>Du hast eine Frage oder möchtest mich unterstützen?
           Ich freue mich auf deine Nachricht.</p>
    </div>

    <div class="contact-content">
        <div class="contact-photo" aria-hidden="true"></div>

        <form class="contact-form">

            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name <span>*</span></label>
                    <input type="text" id="name" name="name"
                           placeholder="Dein Name" required>
                </div>

                <div class="form-group">
                    <label for="vorname">Vorname <span>*</span></label>
                    <input type="text" id="vorname" name="vorname"
                           placeholder="Dein Vorname" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-Mail <span>*</span></label>
                <input type="email" id="email" name="email"
                       placeholder="name@beispiel.ch" required>
            </div>

            <div class="form-group">
                <label for="telefon">Telefon <span class="optional">(optional)</span></label>
                <input type="tel" id="telefon" name="telefon"
                       placeholder="+41 00 000 00 00">
            </div>

            <div class="form-group form-group--inline-label">
                <label for="betreff">Betreff <span>*</span></label>
                <input type="text" id="betreff" name="betreff"
                       placeholder="Worum geht es?" required>
            </div>

            <div class="form-group">
                <label for="nachricht">Nachricht <span>*</span></label>
                <textarea id="nachricht" name="nachricht"
                          placeholder="Erzähl mir mehr über dein Anliegen..."
                          rows="5" required></textarea>
            </div>

            <div class="form-footer">
                <span class="required-note">* Pflichtfelder</span>
                <button type="submit">
                    Senden <span>↗</span>
                </button>
            </div>

        </form>
    </div>
</section>

<dialog class="form-dialog" aria-labelledby="form-dialog-title">
    <div class="form-dialog__content">
        <h2 id="form-dialog-title"></h2>
        <p class="form-dialog__message"></p>
        <button class="form-dialog__close" type="button">Schließen</button>
    </div>
</dialog>

<script src="script.js"></script>

</body>
</html>
